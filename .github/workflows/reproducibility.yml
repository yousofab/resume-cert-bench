name: Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Verify artifacts and simulator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify reproducibility
        run: python scripts/verify_repository.py
      - name: Test the simulator and independent verifier
        run: python -m unittest discover -s tests -v
      - name: Reproduce simulator fixtures
        run: python -m resumecert demo --check results/simulator_smoke_v1.json
      - name: Reproduce matched pilot results, cases, and figure
        run: |
          python -m resumecert pilot --check results/matched_pilot_v1.json
          python -m resumecert pilot --format fixtures --check results/matched_pilot_fixtures_v1.json
          python -m resumecert pilot --format svg --check results/matched_pilot_coverage_v1.svg

name: Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Verify artifacts, simulator, and research results
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify reproducibility
        run: python scripts/verify_repository.py
      - name: Test the simulator and independent verifier
        run: python -m unittest discover -s tests -v
      - name: Reproduce simulator fixtures
        run: python -m resumecert demo --check results/simulator_smoke_v1.json
      - name: Reproduce matched pilot results, cases, and figure
        run: |
          python -m resumecert pilot --check results/matched_pilot_v1.json
          python -m resumecert pilot --format fixtures --check results/matched_pilot_fixtures_v1.json
          python -m resumecert pilot --format svg --check results/matched_pilot_coverage_v1.svg
      - name: Verify confirmatory protocol and case commitments
        run: python scripts/verify_freeze.py
      - name: Reproduce confirmatory results and all run traces
        run: python scripts/run_confirmatory.py --check results
      - name: Reproduce SQLite archive transfer and all run traces
        run: python scripts/run_archive_transfer.py --check results
      - name: Reproduce SQLite checkpoint repair and all run traces
        run: python scripts/run_archive_repair.py --check results
      - name: Reproduce archive notification delivery and durable receipts
        run: python scripts/run_archive_delivery.py --check results/archive_delivery_v1.json
      - name: Reproduce revocation, stale arrivals, and receipt reconciliation
        run: python scripts/run_destination_revocation.py --check results/destination_revocation_v1.json
      - name: Reproduce two-provider failover and permanent retirement
        run: python scripts/run_provider_failover.py --check results/provider_failover_v1.json
      - name: Reproduce retention, independent closure, and restore boundaries
        run: python scripts/run_retention.py --check results/retention_v1.json
      - name: Reproduce open-tail claims and postcommit evidence gaps
        run: python scripts/run_open_tail.py --check results/open_tail_v1.json
      - name: Reproduce purpose-bound terminal evidence and recovery
        run: python scripts/run_terminal_evidence.py --check results/terminal_evidence_v1.json
      - name: Reproduce retained provider authority after projection restore
        run: python scripts/run_provider_authority.py --check results/provider_authority_v1.json
      - name: Reproduce authority rollback and witness boundaries
        run: python scripts/run_authority_rollback.py --check results/authority_rollback_v1.json
      - name: Reproduce bounded witness redo and external effect control
        run: python scripts/run_witness_redo.py --check results/witness_redo_v1.json
